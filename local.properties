## Этот файл автоматически генерируется и НЕ должен попадать в Git.
## Путь к Android SDK на вашем компьютере (D:\kotlin\zina1).
## Если у вас Android Studio установлена по стандартному пути — оставьте как есть,
## иначе замените путь ниже на свой (см. комментарии в конце файла).
sdk.dir=C\:\\Users\\<ВашеИмя>\\AppData\\Local\\Android\\Sdk

## Как узнать правильный путь:
## Android Studio -> File -> Settings -> Languages & Frameworks -> Android SDK
## В поле "Android SDK Location" будет нужный путь, например:
##   C:\Users\Ivan\AppData\Local\Android\Sdk        (обычная установка)
##   D:\Android\Sdk                                  (если ставили на D:)
##
## Важно: в этом файле ':' и '\' нужно экранировать:
##   C:\Users\Ivan\AppData\Local\Android\Sdk  ->  sdk.dir=C\:\\Users\\Ivan\\AppData\\Local\\Android\\Sdk
